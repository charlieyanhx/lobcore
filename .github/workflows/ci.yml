name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "64"
      - run: cargo bench --workspace --no-run
      # the committed synthetic fixture and its replay statistics must regenerate byte-identically
      - run: |
          cargo run --release -p lob-bench -- synth --seed 7 --n 100000 --out /tmp/synth_s7_100k.itch
          cmp /tmp/synth_s7_100k.itch tests/fixtures/synth_s7_100k.itch
          cargo run --release -p lob-bench -- replay --stats tests/fixtures/synth_s7_100k.itch --check-readme README.md
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install maturin==1.15.0 pytest numpy
      - run: cd python/lobcore && maturin build --release --features abi3-py311 -o ../../wheels
      - run: python -m pip install wheels/*.whl
      - run: pytest -q python/tests
