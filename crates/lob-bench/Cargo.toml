[package]
name = "lob-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The `lobcore` command: ITCH replay statistics, synthetic-day writer, README check, quick throughput bench"
build = "build.rs"

[lib]
name = "lob_bench"
path = "src/lib.rs"

[[bin]]
name = "lobcore"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
lob-core = { path = "../lob-core" }
lob-feed = { path = "../lob-feed" }
lob-synth = { path = "../lob-synth" }
